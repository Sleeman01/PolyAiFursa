name: CI/CD

# Replaces ci.yml and ci-cd.yml. deploy.yaml already removed (systemd, superseded).
# Assumed layout: services/yolo, services/img-proc-mcp, services/agent, services/frontend

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      yolo: ${{ steps.filter.outputs.yolo }}
      img_proc_mcp: ${{ steps.filter.outputs.img_proc_mcp }}
      agent: ${{ steps.filter.outputs.agent }}
      frontend: ${{ steps.filter.outputs.frontend }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter needs full history to diff against event.before
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            yolo:
              - 'services/yolo/**'
            img_proc_mcp:
              - 'services/img-proc-mcp/**'
            agent:
              - 'services/agent/**'
            frontend:
              - 'services/frontend/**'
            monitoring:
              - 'monitoring/**'
              - 'docker-compose.yaml'

  test-yolo:
    needs: changes
    if: needs.changes.outputs.yolo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest tests/ --cov=app --cov-report=xml
        working-directory: services/yolo
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: services/yolo/coverage.xml
          fail_ci_if_error: true

  scout-yolo:
    needs: changes
    if: needs.changes.outputs.yolo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: services/yolo
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:scan
      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/yolo-service:scan
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  test-img-proc-mcp:
    needs: changes
    if: needs.changes.outputs.img_proc_mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/img-proc-mcp
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/img-proc-mcp
        run: pytest tests/ -q

  test-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/agent
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/agent
        run: pytest tests/ -q || echo "no tests yet for agent"

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci
      - name: Run tests
        working-directory: services/frontend
        run: npm test || echo "no tests yet for frontend"

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, test-yolo, scout-yolo, test-img-proc-mcp, test-agent, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: yolo
            changed: ${{ needs.changes.outputs.yolo }}
            context: services/yolo
          - name: img-proc-mcp
            changed: ${{ needs.changes.outputs.img_proc_mcp }}
            context: services/img-proc-mcp
          - name: agent
            changed: ${{ needs.changes.outputs.agent }}
            context: services/agent
          - name: frontend
            changed: ${{ needs.changes.outputs.frontend }}
            context: services/frontend
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'
      - name: Log in to DockerHub
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: sleemaneketeh/${{ matrix.name }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ~/PolyAiFursa
            git pull origin main

            SHA="${{ github.sha }}"
            [ "${{ needs.changes.outputs.yolo }}" = "true" ] && \
              sed -i "s/^YOLO_TAG=.*/YOLO_TAG=$SHA/" .env
            [ "${{ needs.changes.outputs.img_proc_mcp }}" = "true" ] && \
              sed -i "s/^IMG_PROC_MCP_TAG=.*/IMG_PROC_MCP_TAG=$SHA/" .env
            [ "${{ needs.changes.outputs.agent }}" = "true" ] && \
              sed -i "s/^AGENT_TAG=.*/AGENT_TAG=$SHA/" .env
            [ "${{ needs.changes.outputs.frontend }}" = "true" ] && \
              sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=$SHA/" .env

            docker compose pull
            docker compose up -d
            docker compose ps
