name: Provision and Bootstrap K8s Cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'AWS region to provision the cluster in'
        required: true
        default: 'us-east-1'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      control_plane_ip: ${{ steps.tf_output.outputs.control_plane_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << CREDS
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CREDS

      - name: Build Lambda deployment package
        run: |
          cd infra/tf/modules/k8s-cluster/lambda
          pip install paramiko -t package --quiet
          cp node_drain.py package/
          cd package
          zip -r ../node_drain.zip . -x "*.pyc" > /dev/null

      - name: Terraform Init
        working-directory: infra/tf
        run: terraform init

      - name: Select or create workspace
        working-directory: infra/tf
        run: terraform workspace select -or-create ${{ inputs.region }}

      - name: Terraform Apply
        working-directory: infra/tf
        run: terraform apply -auto-approve -var-file="tfvars/${{ inputs.region }}.tfvars" -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Get control plane IP
        id: tf_output
        working-directory: infra/tf
        run: echo "control_plane_ip=$(terraform output -raw control_plane_public_ip)" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K8S_CLUSTER_SSH_KEY }}" > ~/.ssh/cluster_key.pem
          chmod 400 ~/.ssh/cluster_key.pem

      - name: Wait for control plane to finish bootstrapping
        run: |
          for i in $(seq 1 45); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/cluster_key.pem \
              ubuntu@${{ needs.provision.outputs.control_plane_ip }} \
              "sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes" 2>/dev/null; then
              echo "Control plane is up and kubectl is working"
              exit 0
            fi
            echo "Waiting for control plane to finish initializing (attempt $i/45)..."
            sleep 20
          done
          echo "Control plane never became ready"
          exit 1

      - name: Fetch kubeconfig artifact
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }}:/home/ubuntu/.kube/config \
            ./kubeconfig
          sed -i "s#server: https://.*:6443#server: https://${{ needs.provision.outputs.control_plane_ip }}:6443#" ./kubeconfig

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: ./kubeconfig

      - name: Idempotently bootstrap cluster (Calico, ArgoCD, EBS CSI driver, Ingress, ArgoCD Applications)
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }} bash << 'REMOTE_SCRIPT'
          set -euxo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          # Calico CNI (idempotent - kubectl apply is safe to re-run)
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml

          # ArgoCD (idempotent, server-side apply avoids annotation-size issue)
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts

          # dev/prod namespaces
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

          # EBS CSI driver (idempotent)
          kubectl apply -k "github.com/kubernetes-sigs/aws-ebs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-1.35"

          # Nginx Ingress Controller — baremetal provider (idempotent)
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/baremetal/deploy.yaml

          # Wait for the controller Service to exist before patching it
          kubectl wait --namespace ingress-nginx \
            --for=condition=Available deployment/ingress-nginx-controller \
            --timeout=180s

          # Pin NodePorts to fixed values so the ALB Target Group config is stable
          # (also adds the metrics port here, since a merge-type patch replaces the whole ports list)
          kubectl patch svc ingress-nginx-controller -n ingress-nginx --type merge -p '{
            "spec": {
              "ports": [
                {"name":"http","port":80,"protocol":"TCP","targetPort":"http","nodePort":30080},
                {"name":"https","port":443,"protocol":"TCP","targetPort":"https","nodePort":30443},
                {"name":"metrics","port":10254,"protocol":"TCP","targetPort":"metrics"}
              ]
            }
          }'

          # The baremetal manifest ships with metrics explicitly disabled and no metrics
          # container port; enable both so Prometheus can scrape the controller
          kubectl patch deployment ingress-nginx-controller -n ingress-nginx --type='json' -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/args","value":[
              "/nginx-ingress-controller",
              "--election-id=ingress-nginx-leader",
              "--controller-class=k8s.io/ingress-nginx",
              "--ingress-class=nginx",
              "--configmap=$(POD_NAMESPACE)/ingress-nginx-controller",
              "--validating-webhook=:8443",
              "--validating-webhook-certificate=/usr/local/certificates/cert",
              "--validating-webhook-key=/usr/local/certificates/key",
              "--enable-metrics=true"
            ]},
            {"op":"replace","path":"/spec/template/spec/containers/0/ports","value":[{"name":"http","containerPort":80,"protocol":"TCP"},{"name":"https","containerPort":443,"protocol":"TCP"},{"name":"webhook","containerPort":8443,"protocol":"TCP"},{"name":"metrics","containerPort":10254,"protocol":"TCP"}]}
          ]'

          kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s

          # metrics-server (idempotent) — required for CPU-based HPAs to compute replica counts
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

          # kubeadm clusters don't issue kubelet serving certs signed by a CA metrics-server trusts,
          # so its default kubelet TLS verification fails; skip verification (acceptable for this course project)
          kubectl patch deployment metrics-server -n kube-system --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

          kubectl wait --namespace kube-system \
            --for=condition=Available deployment/metrics-server \
            --timeout=180s

          echo "Bootstrap complete"
          REMOTE_SCRIPT

      - uses: actions/checkout@v4

      - name: Install kube-prometheus-stack
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            infra/k8s/monitoring/values.yaml \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }}:/tmp/monitoring-values.yaml
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }} bash << 'REMOTE_SCRIPT'
          set -euxo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          if ! command -v helm &> /dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 88.1.5 \
            --namespace monitoring --create-namespace \
            -f /tmp/monitoring-values.yaml \
            --wait --timeout 5m
          REMOTE_SCRIPT

      - name: Install Cluster Autoscaler
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }} bash << 'REMOTE_SCRIPT'
          set -euxo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update

          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
            --version 9.37.0 \
            --namespace kube-system \
            --set cloudProvider=aws \
            --set awsRegion=${{ inputs.region }} \
            --set autoscalingGroups[0].name=sleeman-polyai-k8s-workers-asg \
            --set autoscalingGroups[0].minSize=0 \
            --set autoscalingGroups[0].maxSize=3 \
            --set image.tag=v1.30.7 \
            --wait --timeout 5m
          REMOTE_SCRIPT

      - name: Apply ArgoCD Applications
        run: |
          for i in $(seq 1 20); do
            if scp -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
              infra/argocd/app-dev.yaml infra/argocd/app-prod.yaml \
              ubuntu@${{ needs.provision.outputs.control_plane_ip }}:/tmp/ 2>/dev/null; then
              break
            fi
            sleep 10
          done
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }} \
            "kubectl apply -f /tmp/app-dev.yaml -f /tmp/app-prod.yaml"

          # prod tracks main via a manual promotion gate (no automated syncPolicy, by design),
          # so unlike dev it never syncs itself; trigger one explicit sync here so a full
          # rebuild comes up clean without a human clicking sync in the UI
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cluster_key.pem \
            ubuntu@${{ needs.provision.outputs.control_plane_ip }} \
            "kubectl patch application sleeman-polyai-prod -n argocd --type merge -p '{\"operation\":{\"sync\":{}}}'"