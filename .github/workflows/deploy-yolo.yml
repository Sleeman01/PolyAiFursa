name: Deploy Yolo

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/yolo/**'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/yolo
          push: true
          tags: sleemaneketeh/yolo-service:${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Determine environment from branch
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: docker.io/sleemaneketeh/yolo-service:.*|image: docker.io/sleemaneketeh/yolo-service:${{ github.sha }}|" \
            infra/k8s/${{ steps.env.outputs.env }}/yolo/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/${{ steps.env.outputs.env }}/yolo/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "ci: update yolo image to ${{ github.sha }}" && git push)
