name: Deploy Services

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/PolyAiFursa

            git fetch origin
            git checkout -B dev origin/dev

            # --- YOLO ---
            cd /home/ubuntu/PolyAiFursa/services/yolo
            source .venv/bin/activate
            TMPDIR=$HOME/pip-tmp pip install --no-cache-dir -r requirements.txt
            deactivate
            sudo systemctl restart yolo.service

            # --- AGENT ---
            cd /home/ubuntu/PolyAiFursa/services/agent
            source .venv/bin/activate
            TMPDIR=$HOME/pip-tmp pip install --no-cache-dir -r requirements.txt
            deactivate
            sudo systemctl restart agent.service

            # --- FRONTEND ---
            cd /home/ubuntu/PolyAiFursa/services/frontend
            npm install
            npm run build
            sudo systemctl restart frontend.service

            # --- status ---
            sudo systemctl status yolo.service agent.service frontend.service --no-pager

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/PolyAiFursa

            git fetch origin
            git checkout -B main origin/main

            # --- YOLO ---
            cd /home/ubuntu/PolyAiFursa/services/yolo
            source .venv/bin/activate
            TMPDIR=$HOME/pip-tmp pip install --no-cache-dir -r requirements.txt
            deactivate
            sudo systemctl restart yolo.service

            # --- AGENT ---
            cd /home/ubuntu/PolyAiFursa/services/agent
            source .venv/bin/activate
            TMPDIR=$HOME/pip-tmp pip install --no-cache-dir -r requirements.txt
            deactivate
            sudo systemctl restart agent.service

            # --- FRONTEND ---
            cd /home/ubuntu/PolyAiFursa/services/frontend
            npm install
            npm run build
            sudo systemctl restart frontend.service

            # --- status ---
            sudo systemctl status yolo.service agent.service frontend.service --no-pager