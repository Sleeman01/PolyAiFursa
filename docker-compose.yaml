services:
  yolo:
    image: sleemaneketeh/yolo-service:${YOLO_TAG:-latest}
    build: ./services/yolo
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    ports:
      - "8080:8080"
    networks:
      - polyai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  img-proc-mcp:
    image: sleemaneketeh/img-proc-mcp:${IMG_PROC_MCP_TAG:-latest}
    build: ./services/img-proc-mcp
    environment:
      - MCP_PORT=9000
    networks:
      - polyai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9000), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    image: sleemaneketeh/agent:${AGENT_TAG:-latest}
    pull_policy: build
    build: ./services/agent
    environment:
      - YOLO_SERVICE_URL=http://yolo:8080
      - MCP_SERVICE_URL=http://img-proc-mcp:9000/mcp
      - MODEL=${MODEL:-bedrock_converse:amazon.nova-lite-v1:0}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - CORS_ALLOW_ORIGINS=http://sleeman01-dev.fursa.click:3000,http://localhost:3000
    ports:
      - "8000:8000"
    networks:
      - polyai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      yolo:
        condition: service_healthy
      img-proc-mcp:
        condition: service_healthy

  frontend:
    image: sleemaneketeh/frontend:${FRONTEND_TAG:-latest}
    pull_policy: build
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_AGENT_URL: ${AGENT_PUBLIC_URL}
    ports:
      - "3000:3000"
    networks:
      - polyai-net
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - polyai-net
      - monitoring-net
    restart: unless-stopped
    depends_on:
      - yolo
      - node-exporter

  node-exporter:
    image: prom/node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring-net
      - polyai-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - monitoring-net
    restart: unless-stopped
    depends_on:
      - prometheus

  fluent-bit:
    image: fluent/fluent-bit:4.2.7
    environment:
      - S3_LOGS_BUCKET=${S3_LOGS_BUCKET}
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log
    networks:
      - polyai-net
    restart: unless-stopped

networks:
  polyai-net:
  monitoring-net:

volumes:
  prometheus-data:
  grafana-data:
