apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yolo
  labels:
    app: yolo
    env: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yolo
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
